# Publishes the interface to GitHub Pages.
#
# Pages serves files, not Python, so this build has no scoring engine behind it.
# It ships the engine's frozen output instead (frontend/public/data, written by
# backend/scripts/build_snapshot.py) and the interface says so on its face.
# For live scoring, deploy the Docker image: the API serves the same interface
# and does the real thing.

name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
      # Pages has no server to rewrite unknown paths onto the app. The interface
      # routes on the hash so this is belt and braces, but a stray /score should
      # still land on the app rather than on a 404 page.
      - run: cp frontend/dist/index.html frontend/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
